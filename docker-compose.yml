# Local/production-like stack: React (nginx) -> FastAPI -> PostgreSQL.
# Configuration comes from .env (copy .env.example). The trained model is NOT baked into the image:
# put the Colab exports in backend/models/, backend/artifacts/ and data/ before starting.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Note: keep POSTGRES_PASSWORD URL-safe (no @ : / ? # characters).
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MODEL_PATH: /app/models/lightgbm_energy_forecaster.joblib
      ARTIFACTS_DIR: /app/artifacts
      HISTORY_DATA_PATH: /data/energy_consumption_hourly.csv
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./backend/models:/app/models:ro
      - ./backend/artifacts:/app/artifacts:ro
      - ./data:/data:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

  # Optional experiment tracking: docker compose --profile mlflow up --build
  mlflow:
    profiles: ["mlflow"]
    build:
      context: ./mlflow
    restart: unless-stopped
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"

volumes:
  postgres_data:
  mlflow_data:
